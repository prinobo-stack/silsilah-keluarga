services:
  - type: web
    name: silsilah-keluarga
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
